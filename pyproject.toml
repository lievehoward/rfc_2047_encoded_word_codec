[project]
name = "rfc-2047-encoded-word-codec"
version = "0.1.1"
description = "Encodes and decodes RFC 2047 encoded-word headers, handling Q and B encodings across multiple charsets."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
